---
name: Publish Docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build Image
        run: |
          docker build . -t arma-reforger \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY"
      - name: Save Image
        run: docker save arma-reforger | gzip > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Image
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image
      - name: Load Image
        run: docker load < image.tar.gz
      - name: Test Mod Pruning
        run: |
          scratch="$(mktemp -d)"
          workshop="$scratch/workshop"
          configs="$scratch/configs"
          mod_id="1111111111111111"
          mkdir -p "$workshop/$mod_id" "$configs"
          printf '%s\n' \
            '{"id":"1111111111111111","name":"Stale Mod",' \
            '"revision":{"version":"1.0.0","dependencies":[],' \
            '"downloaded":true}}' \
            > "$workshop/$mod_id/ServerData.json"
          docker run --rm \
            -e ARMA_BINARY=/bin/true \
            -e GAME_MODS_AUTO_PRUNE=true \
            -e SKIP_INSTALL=true \
            -v "$workshop:/reforger/workshop" \
            arma-reforger
          test ! -e "$workshop/$mod_id"

          mkdir -p "$workshop/$mod_id"
          printf '%s\n' \
            '{"id":"1111111111111111","name":"Stale Mod",' \
            '"revision":{"version":"1.0.0","dependencies":[],' \
            '"downloaded":true}}' \
            > "$workshop/$mod_id/ServerData.json"
          printf '%s\n' '{"game":{"name":"Vanilla"}}' \
            > "$configs/custom.json"
          docker run --rm \
            -e ARMA_BINARY=/bin/true \
            -e ARMA_CONFIG=custom.json \
            -e GAME_MODS_AUTO_PRUNE=true \
            -e SKIP_INSTALL=true \
            -v "$configs:/reforger/Configs" \
            -v "$workshop:/reforger/workshop" \
            arma-reforger
          test ! -e "$workshop/$mod_id"
      - name: Run Image
        run: >
          docker run -d
          -e SERVER_A2S_ADDRESS=0.0.0.0
          -e SERVER_A2S_PORT=17777
          -e RCON_PASSWORD=PipelineTest123
          -p 17777:17777/udp
          arma-reforger
      # Pinned so the smoke test does not depend on whichever python3 and pip
      # the runner image happens to ship. --group needs pip 25.1 or newer.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install python dependencies
        run: python -m pip install --group smoke
      - name: Run Test
        run: python ./.github/scripts/steam_query.py

  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image
      - name: Load Image
        run: docker load < image.tar.gz
      - name: Set image tags
        run: |
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner,,}/arma-reforger"
          latest="$image:latest"
          sha="$image:sha-${GITHUB_SHA::7}"
          echo "IMAGE_TAGS=$latest $sha" >> "$GITHUB_ENV"
      - name: Tag and Push Image
        run: |
          for tag in $IMAGE_TAGS; do
            docker tag arma-reforger "$tag"
            docker push "$tag"
          done
